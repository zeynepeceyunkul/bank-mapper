@if (confirmService.current(); as request) {
  <div class="modal-backdrop" (click)="confirmService.respond(false)">
    <div class="modal-box" (click)="$event.stopPropagation()">
      <p class="confirm-message">{{ request.message }}</p>
      <div class="confirm-actions">
        <button type="button" class="cancel-btn" (click)="confirmService.respond(false)">İptal</button>
        <button type="button" class="confirm-btn" (click)="confirmService.respond(true)">Tamam</button>
      </div>
    </div>
  </div>
}
