<section class="institution-list">
  <div class="header">
    <h2>Kurumlar</h2>
    <div class="header-actions">
      <input
        type="text"
        class="new-institution-input"
        placeholder="Kurum adı..."
        aria-label="Yeni kurum adı"
        [(ngModel)]="newInstitutionName"
        (keydown.enter)="createInstitution()"
      />
      <button type="button" mat-flat-button [disabled]="creating() || !newInstitutionName.trim()" (click)="createInstitution()">
        + Ekle
      </button>
    </div>
  </div>

  <div class="filters">
    <input
      type="text"
      class="search-input"
      placeholder="Ada göre ara..."
      aria-label="Kurum ara"
      [value]="search()"
      (input)="onSearchChange($any($event.target).value)"
    />
    <select class="sort-select" aria-label="Sırala" (change)="onSortChange($any($event.target).value)">
      <option value="NameAscending" [selected]="sort() === 'NameAscending'">Ad (A→Z)</option>
      <option value="NameDescending" [selected]="sort() === 'NameDescending'">Ad (Z→A)</option>
      <option value="RecentFirst" [selected]="sort() === 'RecentFirst'">Eklenme (Yeni→Eski)</option>
      <option value="OldestFirst" [selected]="sort() === 'OldestFirst'">Eklenme (Eski→Yeni)</option>
    </select>
  </div>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  @if (loading()) {
    <div class="loading-state">
      <mat-spinner diameter="28" />
    </div>
  } @else if (totalCount() === 0 && !error()) {
    <div class="empty-state">
      <span class="empty-state-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 3H4.99c-1.11 0-1.98.9-1.98 2L3 19c0 1.1.89 2 1.99 2H19c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 12h-4c0 1.66-1.35 3-3 3s-3-1.34-3-3H4.99V5H19v10z" />
        </svg>
      </span>
      <p class="hint">{{ search() ? 'Aramanla eşleşen bir kurum bulunamadı.' : 'Henüz kayıtlı kurum yok.' }}</p>
    </div>
  } @else {
    <div class="institution-table-card">
      <table class="institution-table">
        <thead>
          <tr>
            <th>Ad</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (institution of institutions(); track institution.id) {
            <tr>
              <td class="name-cell">{{ institution.name }}</td>
              <td class="actions-cell">
                <button type="button" mat-icon-button aria-label="Sil" (click)="deleteInstitution(institution)">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <mat-paginator
      [length]="totalCount()"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="pageSizeOptions"
      (page)="onPageChange($event)"
    />
  }
</section>
