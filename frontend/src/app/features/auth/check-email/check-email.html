<app-auth-layout>
  <div class="auth-card-centered">
    <div class="auth-icon-square-lg">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z" stroke="#ffc72c" stroke-width="1.5" />
        <path d="M2 6l10 7 10-7" stroke="#ffc72c" stroke-width="1.5" stroke-linecap="round" />
      </svg>
      <span class="auth-icon-badge">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#fff">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
        </svg>
      </span>
    </div>

    <h2>E-postanı kontrol et</h2>
    <p class="auth-card-description">Hesabını doğrulamak için bir bağlantı gönderildi:</p>
    <span class="auth-email-pill">{{ email }}</span>

    <div class="auth-warning-box">
      <p>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
        </svg>
        Bilgi
      </p>
      <ul>
        <li>Bağlantı <strong>24 saat</strong> geçerlidir.</li>
        <li>E-posta gelmezse <strong>spam/gereksiz</strong> klasörüne bak.</li>
        <li>Bağlantıya tıklayana kadar hesabın aktif olmaz.</li>
      </ul>
    </div>

    <button type="button" class="auth-submit" [disabled]="resending() || resent()" (click)="resend()">
      @if (resent()) {
        Bağlantı tekrar gönderildi
      } @else if (resending()) {
        Gönderiliyor...
      } @else {
        E-postayı almadım, tekrar gönder
      }
    </button>

    <a routerLink="/login" class="auth-back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
      </svg>
      Giriş ekranına dön
    </a>
  </div>
</app-auth-layout>
