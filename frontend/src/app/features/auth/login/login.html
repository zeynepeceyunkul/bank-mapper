<app-auth-layout>
  <div class="auth-card-icon">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffc72c">
      <path
        d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
      />
    </svg>
  </div>
  <h2>Giriş Yap</h2>
  <p class="auth-card-subtitle">Bank Mapper hesabınıza erişin</p>

  <form (ngSubmit)="onSubmit()">
    <div class="auth-field">
      <label for="email">E-posta</label>
      <input
        id="email"
        type="email"
        name="email"
        placeholder="ornek@vakifbank.com.tr"
        autocomplete="email"
        [(ngModel)]="email"
        required
      />
    </div>

    <div class="auth-field">
      <div class="auth-field-label-row">
        <label for="password">Şifre</label>
        <a routerLink="/forgot-password" class="auth-forgot-link">Şifremi unuttum</a>
      </div>
      <div class="auth-password-wrapper">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          placeholder="Şifrenizi girin"
          autocomplete="current-password"
          [(ngModel)]="password"
          required
        />
        <button type="button" class="auth-password-toggle" (click)="showPassword.set(!showPassword())" aria-label="Şifreyi göster/gizle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
            />
          </svg>
        </button>
      </div>
    </div>

    @if (error()) {
      <p class="auth-error">{{ error() }}</p>
    }

    <button type="submit" class="auth-submit" [disabled]="submitting()">
      {{ submitting() ? 'Giriş yapılıyor...' : 'Giriş Yap' }}
    </button>
  </form>

  <div class="auth-divider">veya</div>

  <p class="auth-switch">Hesabın yok mu? <a routerLink="/register">Hesap Oluştur</a></p>
</app-auth-layout>
