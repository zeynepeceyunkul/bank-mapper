<app-auth-layout>
  <div class="auth-card-icon">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffc72c">
      <path
        d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
      />
    </svg>
  </div>
  <h2>Hesap Oluştur</h2>
  <p class="auth-card-subtitle">Bank Mapper'a erişmek için hesap oluşturun</p>

  <form (ngSubmit)="onSubmit()">
    <div class="auth-field">
      <label for="email">E-posta</label>
      <input
        id="email"
        type="email"
        name="email"
        placeholder="ornek@vakifbank.com.tr"
        autocomplete="email"
        [(ngModel)]="email"
        required
      />
    </div>

    <div class="auth-field">
      <label for="password">Şifre</label>
      <div class="auth-password-wrapper">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          placeholder="En az 8 karakter"
          autocomplete="new-password"
          [(ngModel)]="password"
          required
          minlength="8"
        />
        <button type="button" class="auth-password-toggle" (click)="showPassword.set(!showPassword())" aria-label="Şifreyi göster/gizle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
            />
          </svg>
        </button>
      </div>
    </div>

    <div class="auth-field">
      <label for="passwordConfirm">Şifre Tekrar</label>
      <div class="auth-password-wrapper">
        <input
          id="passwordConfirm"
          [type]="showPasswordConfirm() ? 'text' : 'password'"
          name="passwordConfirm"
          placeholder="Şifrenizi tekrar girin"
          autocomplete="new-password"
          [(ngModel)]="passwordConfirm"
          required
        />
        <button
          type="button"
          class="auth-password-toggle"
          (click)="showPasswordConfirm.set(!showPasswordConfirm())"
          aria-label="Şifreyi göster/gizle"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
            />
          </svg>
        </button>
      </div>
    </div>

    @if (error()) {
      <p class="auth-error">{{ error() }}</p>
    }

    <button type="submit" class="auth-submit" [disabled]="submitting()">
      {{ submitting() ? 'Hesap oluşturuluyor...' : 'Hesap Oluştur' }}
    </button>
  </form>

  <div class="auth-divider">veya</div>

  <p class="auth-switch">Zaten hesabın var mı? <a routerLink="/login">Giriş Yap</a></p>
</app-auth-layout>
