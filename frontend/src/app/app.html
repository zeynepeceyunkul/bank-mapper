@if (isAuthPage()) {
  <router-outlet />
} @else {
  <mat-toolbar class="app-header">
    <img src="logo.png" alt="" aria-hidden="true" class="app-logo" />
    <h1>Bank Mapper</h1>
    @if (isLoggedIn()) {
      <nav>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Panel</a>
        <a routerLink="/mapping" routerLinkActive="active">Mapping</a>
        <a routerLink="/preview" routerLinkActive="active">Önizleme</a>
        <a routerLink="/run-history" routerLinkActive="active">Geçmiş</a>
        <a routerLink="/institutions" routerLinkActive="active">Kurumlar</a>
        <a routerLink="/approvals" routerLinkActive="active" class="approvals-link">
          Onaylar
          @if (pendingApprovalCount(); as count) {
            <span class="nav-badge">{{ count }}</span>
          }
        </a>
        <a routerLink="/users" routerLinkActive="active">Kullanıcılar</a>
      </nav>
      <span class="app-spacer"></span>
      <div class="profile-menu-wrapper">
        <button
          type="button"
          class="profile-trigger"
          [class.open]="showProfileMenu()"
          [attr.aria-expanded]="showProfileMenu()"
          aria-haspopup="true"
          aria-label="Profil menüsü"
          (click)="toggleProfileMenu()"
        >
          <span class="profile-avatar">{{ avatarInitial }}</span>
          <span class="profile-trigger-email">{{ email() }}</span>
          <mat-icon class="profile-trigger-chevron">expand_more</mat-icon>
        </button>

        @if (showProfileMenu()) {
          <div class="profile-menu-backdrop" (click)="showProfileMenu.set(false)"></div>
          <div class="profile-menu">
            <div class="profile-menu-header">
              <p class="profile-email">{{ email() }}</p>
              <span class="role-pill" [class]="'role-' + roleClass()">
                <span class="role-dot"></span>{{ role() }}
              </span>
            </div>
            <div class="profile-menu-actions">
              <button type="button" class="profile-logout-btn" (click)="logout()">
                <mat-icon>logout</mat-icon>
                Çıkış Yap
              </button>
            </div>
          </div>
        }
      </div>
    }
  </mat-toolbar>

  <main class="app-content">
    <router-outlet />
  </main>
}

<app-toast-container />
<app-confirm-dialog />
<app-unauthorized-modal />
